# ARCHIVO BASE: solo lo que se necesita en CUALQUIER ambiente (app + nginx).
#
# Local (desarrollo):
#     docker compose up -d
#   Compose carga automaticamente docker-compose.override.yml, que agrega el
#   servidor de Vite (node) y la base de datos de prueba (db).
#
# Produccion:
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   Al pasar -f explicitamente, Compose IGNORA docker-compose.override.yml, asi
#   que NO levanta Vite ni crea una base de datos local: la app usa la base de
#   datos real configurada en el .env.
#
# Ver GUIA_INSTALACION_DOCKER.txt (PARTE 12) para el detalle.

services:
  # Aplicación PHP/Laravel
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www:cached,Z
      - vendor:/var/www/vendor
    environment:
      - APP_NAME=${APP_NAME:-Laravel}
      - APP_ENV=${APP_ENV:-local}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - SESSION_DRIVER=${SESSION_DRIVER:-database}
      - CACHE_STORE=${CACHE_STORE:-database}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-database}
      # Si las migraciones se ejecutan solas al arrancar el contenedor
      # (ver .docker/php/init.sh). docker-compose.prod.yml lo pone en false:
      # en produccion la base de datos puede estar compartida con otra
      # instalacion en vivo, y no se le debe cambiar el esquema sin control.
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-true}
    networks:
      - laravel_network
    expose:
      - 9000
    # Permite que el contenedor alcance servicios que corren en el propio
    # servidor, fuera de Docker (por ejemplo el MySQL/MariaDB nativo de la
    # VPS): dentro del contenedor se usa DB_HOST=host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Nginx
  # El mapeo de puertos NO se define aqui a proposito: cambia segun el
  # ambiente (local publica 8080 a toda la red; produccion lo publica solo en
  # 127.0.0.1 para que el unico acceso sea via el proxy HTTPS). Compose
  # CONCATENA las listas de "ports" al combinar archivos, asi que definirlo
  # aqui y volver a definirlo en el override daria dos mapeos en conflicto.
  nginx:
    image: nginx:1.25-alpine
    container_name: laravel-nginx
    restart: unless-stopped
    volumes:
      - .:/var/www:cached
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,Z
    depends_on:
      - app
    networks:
      - laravel_network

  # Compilador de assets de un solo uso (NO es el servidor de desarrollo).
  # Tiene "profiles", asi que nunca arranca con "docker compose up": solo
  # corre cuando se lo pide explicitamente, compila y termina. Sirve para
  # generar public/build/ en produccion, donde no hay servidor de Vite.
  #
  #     docker compose -f docker-compose.yml -f docker-compose.prod.yml \
  #       --profile build run --rm assets
  assets:
    build:
      context: .
      dockerfile: .docker/node/Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    profiles:
      - build
    restart: "no"
    working_dir: /var/www
    command: npm run build
    volumes:
      - .:/var/www:cached
      - node_modules:/var/www/node_modules
    environment:
      - NODE_ENV=production
    networks:
      - laravel_network


volumes:
  node_modules:
    driver: local
  vendor:
    driver: local

networks:
  laravel_network:
    driver: bridge
